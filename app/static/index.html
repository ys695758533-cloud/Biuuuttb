<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>寻图 · 图片搜索</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243b;font:16px/1.6 system-ui,sans-serif}header{background:#10213b;color:white;padding:22px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;gap:16px;align-items:center}header strong{font-size:24px}header span{font-size:14px;color:#c4d1e4}main{max-width:1120px;margin:32px auto;padding:0 24px}.workspace{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}section{background:white;border:1px solid #dce2ed;border-radius:16px;padding:26px}h1{font-size:28px;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}p{color:#586781;margin:0 0 20px}label{display:block;margin:14px 0 6px}input,select,button{font:inherit;width:100%;border:1px solid #bac6d8;border-radius:8px;padding:11px;background:white}input[type=file]{padding:20px;border:2px dashed #bac6d8;background:#f8faff}button{background:#215bdf;color:white;border:0;cursor:pointer;margin-top:18px;font-weight:600}button:disabled{opacity:.6;cursor:wait}#status{min-height:32px;margin:22px 0;color:#173c7e}#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{padding:14px;border-radius:12px;background:white;border:1px solid #dce2ed}.card img{width:100%;height:210px;object-fit:contain;background:#f1f4f8;border-radius:6px}.card p{font-size:14px;margin:10px 0}.card a{color:#174dc2}small{display:block;color:#586781;margin-top:8px;font-size:14px}footer{margin:30px 0;color:#586781;font-size:14px}@media(max-width:720px){.workspace{grid-template-columns:1fr}header{padding:18px 24px}header span{max-width:160px}main{margin-top:22px}section{padding:20px}}
</style><header><strong>寻图</strong><span id="count">正在读取图片库…</span></header><main><div class="workspace"><section><h1>用一张图片，寻找相似图片</h1><p>搜索你已经建立的图片库，找到图片后打开对应的 X 原帖。</p><form id="search"><label for="query">选择要搜索的图片</label><input id="query" name="file" type="file" accept="image/jpeg,image/png,image/webp" required><label for="mode">搜索方式</label><select name="mode" id="mode"><option value="hybrid">综合相似度</option><option value="phash">寻找同图 / 压缩版本</option><option value="clip">寻找视觉相似图片</option></select><button>开始搜索</button></form></section><section><h2>先把图片加入库中</h2><p>第一次使用，请先加入几张测试图片。原帖链接需要你自行填写。</p><form id="add"><label for="source">入库图片</label><input id="source" name="file" type="file" accept="image/jpeg,image/png,image/webp" required><label for="post">X 原帖链接（可选）</label><input id="post" name="post_url" type="url" placeholder="https://x.com/用户名/status/数字"><button>加入图片库</button></form><small>支持 JPG、PNG、WebP；每张最多 10 MB。</small></section></div><div id="status" role="status" aria-live="polite"></div><h2>搜索结果</h2><p id="empty">加入图片后，选择一张图片开始搜索。</p><div id="results"></div><footer>仅搜索已入库图片。相似度用于排序，不代表同一张图的概率；大幅裁剪或截图可能影响结果。查询图片不会入库。</footer></main><script>
const statusEl=document.querySelector('#status'),results=document.querySelector('#results'),empty=document.querySelector('#empty');
async function refresh(){try{const r=await fetch('/api/count');if(!r.ok)throw Error();const d=await r.json();document.querySelector('#count').textContent=`图片库 · ${d.count} 张图片`}catch{document.querySelector('#count').textContent='图片库暂时不可用'}}
function render(items){results.replaceChildren();empty.textContent=items.length?'按相似度排序，最多显示 50 张。':'图片库为空，请先加入图片。';for(const item of items){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src='/api/images/'+item.id;img.alt='图库图片 '+item.id;img.loading='lazy';const p=document.createElement('p');p.textContent=`排序分 ${item.score.toFixed(3)} · 同图差异 ${item.phash_distance}/64 · 视觉相似 ${item.clip_similarity.toFixed(3)}`;card.append(img,p);if(item.post_url){const a=document.createElement('a');a.href=item.post_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='打开 X 原帖 ↗';card.append(a)}else{const t=document.createElement('small');t.textContent='未填写原帖链接';card.append(t)}results.append(card)}}
for(const id of ['search','add'])document.getElementById(id).addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,btn=form.querySelector('button');const data=new FormData(form),file=data.get('file');if(file.size>10*1024*1024){statusEl.textContent='图片不能超过 10 MB';return}btn.disabled=true;statusEl.textContent=id==='search'?'正在搜索，请稍候…':'正在加入图片库，请稍候…';try{const r=await fetch(id==='search'?'/api/search':'/api/images',{method:'POST',body:data});const text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error(r.ok?'响应格式异常':text||'请求失败')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'提交失败，请检查图片和链接');if(id==='search'){render(d.results);statusEl.textContent=`搜索完成，找到 ${d.results.length} 张候选图片。`}else{statusEl.textContent=d.message;form.reset();await refresh()}}catch(err){statusEl.textContent=err.message||'网络异常，请重试'}finally{btn.disabled=false}});refresh();
</script></html>
